name: Build Komari 1.4.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取你的 Komari 1.4.3
      - name: Checkout Komari
        uses: actions/checkout@v7
        with:
          repository: wander44-svg/komari
          ref: komari-1.4.3
          path: komari

      # 2. 获取你的 Komari Web 1.4.3
      - name: Checkout Komari Web
        uses: actions/checkout@v7
        with:
          repository: wander44-svg/komari-web
          ref: komari-web-1.4.3
          path: komari-web

      # 3. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: komari-web/package-lock.json

      # 4. 安装 Web 依赖
      - name: Install Web dependencies
        working-directory: komari-web
        run: npm ci

      # 5. 编译 Web
      - name: Build Web
        working-directory: komari-web
        run: npm run build

      # 6. 按 Komari 1.4.3 的结构放置 Web
      - name: Package Web
        run: |
          rm -rf komari/web/public/defaultTheme
          mkdir -p komari/web/public/defaultTheme/dist

          cp -r komari-web/dist/* \
            komari/web/public/defaultTheme/dist/

          cp komari-web/komari-theme.json \
            komari/web/public/defaultTheme/

      # 8. 安装 Go
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: komari/go.mod
          cache: true
          cache-dependency-path: komari/go.sum

      # 9. 编译 Komari
      - name: Build Komari
        working-directory: komari
        run: |
          CGO_ENABLED=1 go build -o komari

      # 10. 保存编译结果
      - name: Upload Komari
        uses: actions/upload-artifact@v4
        with:
          name: komari-1.4.3-test
          path: komari/komari

      - name: Verify Web files
        run: |
          test -f komari/web/public/defaultTheme/dist/index.html
          test -f komari/web/public/defaultTheme/komari-theme.json
          echo "Web files OK"
          ls -lah komari/web/public/defaultTheme
          ls -lah komari/web/public/defaultTheme/dist | head -20
